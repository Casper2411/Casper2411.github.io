<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f2f2f2;
    margin: 0;
    padding: 12px;
    box-sizing: border-box;
  }

  .bingo-card {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 2vw;
    background: #333;
    padding: 2vw;
    border-radius: 8px;
    width: min(95vw, 600px);
    aspect-ratio: 1 / 1;
    box-sizing: border-box;
  }

  .cell {
    position: relative;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5vw;
    box-sizing: border-box;
    font-size: clamp(11px, 3vw, 16px);
    cursor: pointer;
    border-radius: 4px;
    user-select: none;
    overflow: hidden;
  }

  .cell.marked {
    background: #ffe08a;
  }

  .cell.marked::before,
  .cell.marked::after {
    content: "";
    position: absolute;
    top: 8%;
    left: 50%;
    width: 4px;
    height: 84%;
    background: #d9363e;
  }

  .cell.marked::before {
    transform: translateX(-50%) rotate(45deg);
  }

  .cell.marked::after {
    transform: translateX(-50%) rotate(-45deg);
  }
</style>
</head>
<body>

<div class="bingo-card" id="bingoCard"></div>

<script>
  const card = document.getElementById('bingoCard');

  // Add or change sentences here. There must be exactly 25 entries (one per square).
  const sentences = [
    "I have skydived", "I have a plant I've kept alive for over a year", "I play an instrument", "I collect something", "I have been camping in a tent or van",
    "I have a pet", "I have younger siblings", "I have bungee jumped", "I have been to another continent", "I have been on TV or in a newspaper",
    "I have missed a flight or train", "I do a team sport", "I speak more than two languages", "I have read a whole book", "I have volunteered somewhere",
    "I have been to a music festival", "I have been to a wedding this year", "I have given a presentation in front of more than 50 people", "I have a hidden talent", "I have met someone famous"
  ];

  const totalCells = sentences.length;

  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement('div');
    cell.classList.add('cell');
    cell.textContent = sentences[i];
    cell.addEventListener('click', () => {
      cell.classList.toggle('marked');
    });
    card.appendChild(cell);
  }
</script>

</body>
</html>
